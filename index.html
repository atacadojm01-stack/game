<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Saga do Gaúcho</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #2c3e50;
            color: white;
            margin: 0;
            padding: 10px;
            overflow-x: hidden; 
        }
        h1 { color: #f1c40f; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); font-size: 24px; margin-top: 5px;}
        p { margin-top: 0; font-size: 13px; color: #bdc3c7; }
        
        #game-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 400px; 
            overflow: hidden; 
            border-radius: 10px;
        }
        #game-container {
            background-color: #ecf0f1; 
            border: 6px solid #34495e;
            border-radius: 10px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.5);
            cursor: none; 
            transition: background-color 1.5s ease, filter 0.3s;
            touch-action: none; 
        }
        
        /* Efeito Cachaça */
        @keyframes bebo {
            0% { transform: rotate(0deg); filter: blur(0px); }
            25% { transform: rotate(3deg); filter: blur(1px); }
            50% { transform: rotate(-3deg); filter: blur(2px); }
            75% { transform: rotate(2deg); filter: blur(1px); }
            100% { transform: rotate(0deg); filter: blur(0px); }
        }
        .drunk-effect {
            animation: bebo 2s infinite;
            border-color: #8e44ad !important;
        }

        /* Efeito Giroflex da Polícia */
        @keyframes giroflex-anim {
            0% { box-shadow: inset 0 0 40px red; }
            50% { box-shadow: inset 0 0 40px blue; }
            100% { box-shadow: inset 0 0 40px red; }
        }
        .giroflex-effect {
            animation: giroflex-anim 0.5s infinite !important;
        }

        /* Notificação Fake de WhatsApp */
        #fake-notif {
            position: absolute;
            top: -100px;
            left: 5%;
            width: 90%;
            background-color: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 50;
            pointer-events: none; 
            box-sizing: border-box;
            text-align: left;
        }
        #fake-notif.show { top: 15px; }
        #fake-notif .icon { font-size: 28px; }
        #fake-notif h4 { margin: 0; font-size: 15px; color: #25D366; }
        #fake-notif p { margin: 2px 0 0 0; font-size: 13px; color: #555; font-weight: bold;}

        #stats {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ecf0f1;
        }
        canvas {
            display: block;
            width: 100%; 
            height: auto; 
            border-radius: 5px;
            touch-action: none;
        }

        /* Telas de Menu e Game Over */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 10px;
            z-index: 100;
        }
        #game-over-screen { display: none; }

        .diff-btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin: 6px;
            width: 80%; 
            max-width: 250px;
        }
        .btn-easy { background-color: #2ecc71; }
        .btn-normal { background-color: #f1c40f; color: #333; }
        .btn-hard { background-color: #e74c3c; }
        .btn-menu { background-color: #3498db; margin-top: 20px;}
        
        .title-start { margin-bottom: 5px; color: #f1c40f; font-size: 22px;}
        .subtitle-start { font-size: 13px; margin-bottom: 20px; color: #bdc3c7; padding: 0 10px;}
    </style>
</head>
<body>

    <h1>🤠 A Saga do Gaúcho 🏍️</h1>
    <p>Arraste na área escura. Cuidado com maridos, polícia e a cachaça!</p>
    <div id="stats">
        Pontos: <span id="score" style="color: #2ecc71;">0</span> | Vidas: <span id="lives" style="color: #e74c3c;">0</span>
    </div>
    
    <div id="game-wrapper">
        
        <!-- Notificação de Trollagem -->
        <div id="fake-notif">
            <div class="icon">💬</div>
            <div>
                <h4 id="notif-name">Esposa 😠</h4>
                <p id="notif-msg">Onde você tá?? Chega em casa agora!</p>
            </div>
        </div>

        <div id="start-screen" class="overlay-screen">
            <h2 class="title-start">Pronto pra zoeira?</h2>
            <p class="subtitle-start">Aumente o som! Arraste o dedo na parte de baixo para jogar.</p>
            <button class="diff-btn btn-easy" onclick="startGame('facil')">🟢 FÁCIL</button>
            <button class="diff-btn btn-normal" onclick="startGame('normal')">🟡 MÉDIO</button>
            <button class="diff-btn btn-hard" onclick="startGame('dificil')">🔴 DIFÍCIL</button>
        </div>

        <div id="game-over-screen" class="overlay-screen">
            <h2 style="color: #e74c3c; font-size: 32px; margin-bottom: 5px;">FIM DE LINHA!</h2>
            <p style="font-size: 18px; color: #ecf0f1;">O Gaúcho rodou!</p>
            <h3 style="color: #f1c40f; font-size: 24px;">Pontuação: <span id="final-score">0</span></h3>
            <button class="diff-btn btn-menu" onclick="resetToMenu()">⬅️ Voltar ao Menu</button>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreEl = document.getElementById("score");
        const livesEl = document.getElementById("lives");
        const startScreen = document.getElementById("start-screen");
        const gameOverScreen = document.getElementById("game-over-screen");
        const finalScoreEl = document.getElementById("final-score");
        const gameContainer = document.getElementById("game-container");
        const fakeNotif = document.getElementById("fake-notif");

        let score = 0, lives = 0, gameOver = false, gameRunning = false, animationId, frameCount = 0;
        let isDrunk = false, drunkTimer = 0;
        const groundY = 500; 

        // --- SISTEMA DE ÁUDIO ---
        const bgMusic = new Audio("musica.mp3");
        bgMusic.loop = true;
        bgMusic.volume = 0.3; 
        
        const sfxMoto = new Audio("moto.mp3");
        const sfxTapa = new Audio("tapa.mp3");
        const sfxSirene = new Audio("sirene.mp3");
        const sfxGlup = new Audio("glup.mp3");

        function playSfx(audioObj) {
            audioObj.currentTime = 0;
            audioObj.play().catch(e => console.log("Áudio não encontrado ou bloqueado: " + e));
        }

        let currentDifficulty = {};
        const configFase = {
            facil: { vidas: 8, chanceBom: 0.90, velocidade: 0.8 },
            normal: { vidas: 5, chanceBom: 0.75, velocidade: 1.0 },
            dificil: { vidas: 2, chanceBom: 0.50, velocidade: 1.3 }
        };

        const gauchoImg = new Image();
        gauchoImg.src = "gaucho.png"; 

        const gaucho = { x: 170, y: 430, width: 60, height: 60, speed: 7, dx: 0 };
        const items = [];
        const floatingTexts = [];
        const particles = []; 
        
        // --- EMOJIS (Dinheiro Adicionado) ---
        const goodEmojis = ['👩', '👰', '🏍️', '💃', '💖', '🥤', '💰', '💵']; 
        const badEmojis = ['🧔', '👨', '👮'];       

        // --- TROLLAGEM DO CHAPA ADICIONADA ---
        const zapMessages = [
            { name: "Esposa 😠", msg: "Onde você tá?? Chega em casa agora!" },
            { name: "Patrão", msg: "O caminhão Chegou! Cadê você pra descarregar?" },
            { name: "Amor ❤️", msg: "Você tá no bar de novo???" }
        ];

        // --- LOCUÇÃO CORRIGIDA ---
        function speak(texto) {
            // Só fala se o robô estiver com a boca fechada (evita atropelar as frases)
            if (speechSynthesis.speaking) return; 

            const utterance = new SpeechSynthesisUtterance(texto);
            utterance.lang = "pt-BR";
            utterance.pitch = isDrunk ? 0.7 : 1.3; 
            utterance.rate = isDrunk ? 0.8 : 1.2; 
            speechSynthesis.speak(utterance);
        }

        function addText(x, y, text, color) {
            floatingTexts.push({ x: x, y: y, text: text, color: color, life: 50 });
        }

        function createParticles(x, y, type) {
            let pEmoji = '💖';
            if (type === 'moto') pEmoji = '💨'; 
            if (type === 'dinheiro') pEmoji = '💲';
            if (type === 'bad') pEmoji = '💥';  
            if (type === 'cachaca') pEmoji = '✨';

            for (let i = 0; i < 4; i++) {
                particles.push({
                    x: x + (Math.random() * 30 - 15),
                    y: y + (Math.random() * 30 - 15),
                    vx: (Math.random() * 4 - 2),
                    vy: (Math.random() * -5 - 2), 
                    life: 40,
                    maxLife: 40,
                    emoji: pEmoji
                });
            }
        }

        function triggerFakeNotification() {
            if (fakeNotif.classList.contains("show")) return;
            const zap = zapMessages[Math.floor(Math.random() * zapMessages.length)];
            document.getElementById("notif-name").innerText = zap.name;
            document.getElementById("notif-msg").innerText = zap.msg;
            
            fakeNotif.classList.add("show");
            speak("Mensagem no Zap!");

            setTimeout(() => {
                fakeNotif.classList.remove("show");
            }, 3500);
        }

        function spawnItem() {
            const size = 35; 
            const x = Math.random() * (canvas.width - size * 1.5) + (size / 2);
            
            let phaseMultiplier = 1 + (Math.floor(score / 100) * 0.15); 
            let baseSpeed = (1.8 + (score * 0.01)) * currentDifficulty.velocidade * phaseMultiplier;
            
            let isCachaca = Math.random() < 0.05;
            if (isCachaca) {
                items.push({ x, y: -40, size, speed: baseSpeed, emoji: '🍺', type: 'cachaca' });
                return;
            }

            const isGood = Math.random() < currentDifficulty.chanceBom; 
            let speed = isGood ? baseSpeed : baseSpeed + 0.5; 
            let emoji = isGood ? goodEmojis[Math.floor(Math.random() * goodEmojis.length)] : badEmojis[Math.floor(Math.random() * badEmojis.length)];
            let type = isGood ? "good" : "bad";
            
            items.push({ x, y: -40, size, speed, emoji, type });
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") gaucho.dx = gaucho.speed;
            else if (e.key === "ArrowLeft") gaucho.dx = -gaucho.speed;
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight" || e.key === "ArrowLeft") gaucho.dx = 0;
        });

        function moveWithPointer(clientX) {
            if (!gameRunning || gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            let pointerX = (clientX - rect.left) * scaleX;
            
            if (isDrunk) { pointerX = canvas.width - pointerX; }
            
            gaucho.x = pointerX - (gaucho.width / 2);
            if (gaucho.x < 0) gaucho.x = 0;
            if (gaucho.x + gaucho.width > canvas.width) gaucho.x = canvas.width - gaucho.width;
        }

        canvas.addEventListener("mousemove", (e) => moveWithPointer(e.clientX));
        canvas.addEventListener("touchstart", (e) => { e.preventDefault(); moveWithPointer(e.touches[0].clientX); }, { passive: false });
        canvas.addEventListener("touchmove", (e) => { e.preventDefault(); moveWithPointer(e.touches[0].clientX); }, { passive: false });

        function update() {
            if (!gameRunning || gameOver) return;

            let phase = Math.floor(score / 100);
            if (phase === 0) gameContainer.style.backgroundColor = "#ecf0f1"; 
            else if (phase === 1) gameContainer.style.backgroundColor = "#f39c12"; 
            else gameContainer.style.backgroundColor = "#2c3e50"; 

            if (isDrunk) { gaucho.x += -gaucho.dx; } else { gaucho.x += gaucho.dx; }
            if (gaucho.x < 0) gaucho.x = 0;
            if (gaucho.x + gaucho.width > canvas.width) gaucho.x = canvas.width - gaucho.width;

            if (isDrunk) {
                drunkTimer--;
                if (drunkTimer <= 0) {
                    isDrunk = false;
                    gameContainer.classList.remove('drunk-effect');
                    addText(gaucho.x, gaucho.y - 20, "SÓBRIO!", "#3498db");
                    // Ignora o bloqueio do robô para avisar que ficou sóbrio
                    let forceSpeak = new SpeechSynthesisUtterance("Passou a cachaça!");
                    forceSpeak.lang = "pt-BR";
                    speechSynthesis.speak(forceSpeak);
                }
            }

            frameCount++;
            let spawnRate = currentDifficulty === configFase.dificil ? 55 : 70;
            if (frameCount % spawnRate === 0) spawnItem();

            if (Math.random() < 0.002) triggerFakeNotification();

            let temPolicia = items.some(i => i.emoji === '👮');
            if (temPolicia && !gameContainer.classList.contains('giroflex-effect')) {
                gameContainer.classList.add('giroflex-effect');
                playSfx(sfxSirene);
            } else if (!temPolicia) {
                gameContainer.classList.remove('giroflex-effect');
            }

            for (let i = 0; i < items.length; i++) {
                let item = items[i];
                item.y += item.speed;

                let hitGaucho = (
                    item.y + (item.size / 3) > gaucho.y && 
                    item.y - (item.size / 2) < gaucho.y + gaucho.height && 
                    item.x > gaucho.x - (item.size / 2) && 
                    item.x < gaucho.x + gaucho.width + (item.size / 2)
                );

                if (hitGaucho) {
                    if (item.type === "good") {
                        score += 10;
                        scoreEl.innerText = score;
                        
                        let particleType = 'good';
                        if (item.emoji === '🏍️') particleType = 'moto';
                        if (item.emoji === '💰' || item.emoji === '💵') particleType = 'dinheiro';
                        
                        createParticles(gaucho.x + gaucho.width/2, gaucho.y, particleType);
                        
                        if(item.emoji === '🏍️') playSfx(sfxMoto);
                        else speak("Boa!");
                        
                    } 
                    else if (item.type === "cachaca") {
                        isDrunk = true;
                        drunkTimer = 300; 
                        gameContainer.classList.add('drunk-effect');
                        createParticles(gaucho.x + gaucho.width/2, gaucho.y, 'cachaca');
                        playSfx(sfxGlup);
                        speak("Bateu a cachaça!");
                    } 
                    else { 
                        lives -= 1;
                        livesEl.innerText = lives;
                        createParticles(gaucho.x + gaucho.width/2, gaucho.y, 'bad');
                        playSfx(sfxTapa);
                        speak("Deu ruim!");
                    }
                    items.splice(i, 1);
                    i--;
                    checkGameOver();
                    continue;
                }

                // --- SEM PUNIÇÃO PARA COISAS BOAS ---
                if (item.y - item.size > groundY) {
                    // Apenas remove da tela, sem mexer nas vidas ou falar algo
                    items.splice(i, 1);
                    i--;
                }
            }

            for (let i = 0; i < floatingTexts.length; i++) {
                floatingTexts[i].y -= 1;
                floatingTexts[i].life -= 1;
                if (floatingTexts[i].life <= 0) { floatingTexts.splice(i, 1); i--; }
            }

            for (let i = 0; i < particles.length; i++) {
                particles[i].x += particles[i].vx;
                particles[i].y += particles[i].vy;
                particles[i].life -= 1;
                if (particles[i].life <= 0) { particles.splice(i, 1); i--; }
            }
        }

        function checkGameOver() {
            if (lives <= 0) {
                gameOver = true;
                gameRunning = false;
                bgMusic.pause();
                
                gameContainer.classList.remove('giroflex-effect');
                fakeNotif.classList.remove("show"); 
                
                livesEl.innerText = "0";
                
                // Força o robô a avisar que perdeu (interrompendo qualquer outra fala)
                speechSynthesis.cancel();
                let forceSpeak = new SpeechSynthesisUtterance("Fim de linha Gaúcho! Te pegaram!");
                forceSpeak.lang = "pt-BR";
                speechSynthesis.speak(forceSpeak);
                
                finalScoreEl.innerText = score;
                gameOverScreen.style.display = "flex";
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gauchoImg.complete && gauchoImg.naturalWidth !== 0) {
                ctx.drawImage(gauchoImg, gaucho.x, gaucho.y, gaucho.width, gaucho.height);
            } else {
                ctx.fillStyle = "#34495e";
                ctx.fillRect(gaucho.x, gaucho.y, gaucho.width, gaucho.height);
                ctx.fillStyle = "white";
                ctx.font = "bold 14px Arial";
                ctx.textAlign = "center";
                ctx.fillText("FOTO", gaucho.x + gaucho.width/2, gaucho.y + gaucho.height/2 - 5);
            }

            ctx.textAlign = "center";
            for (let item of items) {
                ctx.font = "35px Arial";
                ctx.fillStyle = "black"; 
                ctx.fillText(item.emoji, item.x, item.y);
            }

            for (let p of particles) {
                ctx.font = "20px Arial";
                ctx.globalAlpha = p.life / p.maxLife; 
                ctx.fillText(p.emoji, p.x, p.y);
                ctx.globalAlpha = 1.0;
            }

            ctx.fillStyle = "#1a252f"; 
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(0, groundY, canvas.width, 4);
            ctx.fillStyle = "#ecf0f1";
            ctx.font = "bold 16px Arial";
            ctx.fillText("👆 ARRASTE O DEDO AQUI 👆", canvas.width / 2, groundY + 55);

            ctx.font = "bold 20px Arial";
            for (let ft of floatingTexts) {
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.life / 50; 
                ctx.fillText(ft.text, ft.x + gaucho.width/2, ft.y);
                ctx.globalAlpha = 1.0;
            }
        }

        function loop() {
            update();
            draw();
            if (!gameOver && gameRunning) {
                animationId = requestAnimationFrame(loop);
            }
        }

        function startGame(dificuldade) {
            currentDifficulty = configFase[dificuldade];
            lives = currentDifficulty.vidas;
            livesEl.innerText = lives;
            score = 0;
            scoreEl.innerText = score;
            gameContainer.style.backgroundColor = "#ecf0f1"; 
            
            startScreen.style.display = "none";
            gameOverScreen.style.display = "none";
            gameRunning = true;
            gameOver = false;
            
            bgMusic.currentTime = 0; 
            bgMusic.play().catch(e => console.log("Áudio bloqueado"));
            
            loop();
            
            speechSynthesis.cancel();
            let speech = new SpeechSynthesisUtterance("Valendo, Gaúcho!");
            speech.lang = "pt-BR";
            speechSynthesis.speak(speech);
        }

        function resetToMenu() {
            items.length = 0;
            floatingTexts.length = 0;
            particles.length = 0;
            isDrunk = false;
            gameContainer.classList.remove('drunk-effect');
            gameContainer.classList.remove('giroflex-effect');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            gameOverScreen.style.display = "none";
            startScreen.style.display = "flex";
        }
    </script>
</body>
</html>
